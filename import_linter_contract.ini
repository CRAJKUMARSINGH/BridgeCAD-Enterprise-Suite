# Architecture invariants — GUIDE.md §3.
# Enforced in CI by the "import-linter" job in .github/workflows/suite-ci.yml.
#
# The contracts analyse the real import graph, so the workspace must be
# importable (CI installs it via .github/actions/setup-suite).

[importlinter]
root_packages =
    bridgecad_core
    bridgecad_io
    bridgecad_draw
    bridgecad_bill
    bridgecad_qa
    bridgecad_export
    bridgecad_plugins
    bridgecad_ai
    bridgecad_infra
include_external_packages = True


[importlinter:contract:core-is-a-leaf]
name = Core is a leaf — bridgecad-core imports no other Suite package (§3.3)
type = forbidden
source_modules =
    bridgecad_core
forbidden_modules =
    bridgecad_io
    bridgecad_draw
    bridgecad_bill
    bridgecad_qa
    bridgecad_export
    bridgecad_plugins
    bridgecad_ai
    bridgecad_infra


[importlinter:contract:draw-bill-qa-are-isolated]
name = Draw, Bill and QA never import each other (§3.4)
type = forbidden
source_modules =
    bridgecad_draw
    bridgecad_bill
    bridgecad_qa
forbidden_modules =
    bridgecad_draw
    bridgecad_bill
    bridgecad_qa
    bridgecad_export


[importlinter:contract:only-export-fans-out]
name = Only bridgecad-export fans out to Draw/Bill/QA (§3.4)
type = forbidden
source_modules =
    bridgecad_core
    bridgecad_io
    bridgecad_plugins
    bridgecad_ai
    bridgecad_infra
forbidden_modules =
    bridgecad_draw
    bridgecad_bill
    bridgecad_qa
