name: Roadmap status

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: roadmap-status
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect roadmap issues
        uses: actions/github-script@v7
        with:
          script: |
            const rows = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'roadmap',
              state: 'all',
              per_page: 100,
            });
            const out = rows.map(i => ({
              number: i.number,
              title: i.title,
              state: i.state,
              url: i.html_url,
              labels: i.labels.map(l => (typeof l === 'string' ? l : l.name)),
              closed_at: i.closed_at,
            }));
            require('fs').writeFileSync('roadmap.json', JSON.stringify(out, null, 2));

      - name: Render progress doc
        run: python scripts/render_roadmap_status.py roadmap.json > docs/ROADMAP_STATUS.md

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: refresh roadmap status [skip ci]"
          file_pattern: docs/ROADMAP_STATUS.md
