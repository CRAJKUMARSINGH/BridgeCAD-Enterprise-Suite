name: bridgecad-enterprise
services:

  # --- FastAPI Gateway ---------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    image: bridgecad/api:dev
    container_name: bridgecad-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      ENV: dev
      DB_URL: postgresql+psycopg://bridgecad:bridgecad@db:5432/bridgecad
      CACHE_URL: redis://cache:6379/0
      STORAGE_S3_ENDPOINT: http://storage:9000
      STORAGE_S3_KEY: minioadmin
      STORAGE_S3_SECRET: minioadmin
      STORAGE_S3_BUCKET: bridgecad
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - ./packages:/app/packages
      - ./apps/api-gateway:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # --- PostgreSQL (prod) / SQLite (dev default fallback) ---------------------
  db:
    image: postgres:16-alpine
    container_name: bridgecad-db
    environment:
      POSTGRES_USER: bridgecad
      POSTGRES_PASSWORD: bridgecad
      POSTGRES_DB: bridgecad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgecad"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Redis cache ------------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: bridgecad-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- MinIO S3-compatible storage ------------------------------------------
  storage:
    image: minio/minio:latest
    container_name: bridgecad-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Arq async workers -----------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    image: bridgecad/worker:dev
    container_name: bridgecad-worker
    command: python -c "from bridgecad_infra.queue import run_worker; run_worker()"
    environment:
      ENV: dev
      DB_URL: postgresql+psycopg://bridgecad:bridgecad@db:5432/bridgecad
      CACHE_URL: redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - ./packages:/app/packages

  # --- OpenTelemetry Collector + Jaeger (profiling) -------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: bridgecad-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP GRPC
      - "4318:4318"     # OTLP HTTP
    profiles:
      - observability

volumes:
  pgdata:
  miniodata:
