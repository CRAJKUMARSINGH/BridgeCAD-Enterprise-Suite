name: Bug report
description: Something is broken or produces wrong output
title: "[Bug] "
labels: ["bug", "status:needs-repro"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, run `python -m bridgecad info` from the repo root and
        paste the output below. It resolves the workspace paths and answers most
        import questions immediately.

        **First check [docs/troubleshooting.md](https://github.com/CRAJKUMARSINGH/BridgeCAD-Enterprise-Suite/blob/main/docs/troubleshooting.md) — it lists the known non-bugs.**

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: One or two sentences. Concrete, not "it doesn't work".
      placeholder: Generating the 7-sheet package for a 3-span workbook produces an empty sheet 4.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command or request
      description: Copy-paste, including flags. For API bugs include method, path and body.
      render: shell
      placeholder: |
        bridgecad-cli draw booklet bridge.xlsx -o out/
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Include the full traceback. Do not truncate.
      render: shell
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        Attach the workbook if you can. If you cannot share it, say which
        template it came from and which fields you changed.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - core (models, geometry, validation)
        - io (Excel, CSV, JSON)
        - draw (DXF, sheets, layers)
        - bill (BOQ, rates)
        - qa (rules, compliance)
        - export (bundle, manifest)
        - plugins
        - ai
        - infra (db, cache, auth)
        - cli
        - api
        - streamlit ui
        - react console
        - docs
    validations:
      required: true

  - type: dropdown
    id: entry
    attributes:
      label: Which generation
      options:
        - BridgeCAD Enterprise Suite (repo root) — ACTIVE
        - Ultimate Bridge GAD Generator (streamlit_app_ultimate.py) — legacy
        - Lean app (app_lean.py)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: info
    attributes:
      label: Output of `python -m bridgecad info`
      render: shell
    validations:
      required: true

  - type: textarea
    id: manifest
    attributes:
      label: manifest.json
      description: >
        If the bug is in generated output, paste the manifest. It carries
        versions, standards version and input hash — the audit trail.
      render: json

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmed
      options:
        - label: I read docs/troubleshooting.md and this is not a listed non-bug
          required: true
        - label: I am running the Suite from the repo root, not the legacy app
          required: true
        - label: This is reproducible on a clean clone of main
          required: true
