name: API reference

# The MkDocs documentation site was retired with the repository's markdown
# corpus (owner instruction: all *.md removed). What remains is the Sphinx
# API reference, which renders from docs/api/**.rst and the package docstrings,
# so it does not depend on any markdown file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sphinx:
    name: API reference (Sphinx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-suite
        with:
          extras: docs
      - run: pip install -r docs/api/requirements.txt
      - run: python scripts/gen_api_stubs.py
      - run: sphinx-build -W --keep-going -b html docs/api docs/api/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: docs/api/_build/html
