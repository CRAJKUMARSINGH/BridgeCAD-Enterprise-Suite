[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgecad-cli-console"
version = "0.1.0"
description = "BridgeCAD Enterprise — Typer CLI console"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.8.0,<17.0",
  "click>=8.1.0",
  "shellingham>=1.3.0",
  "bridgecad-core @ file://../../packages/bridgecad-core",
  "bridgecad-io @ file://../../packages/bridgecad-io",
  "bridgecad-draw @ file://../../packages/bridgecad-draw",
  "bridgecad-plugins @ file://../../packages/bridgecad-plugins",
  "bridgecad-bill @ file://../../packages/bridgecad-bill",
  "bridgecad-qa @ file://../../packages/bridgecad-qa",
  "bridgecad-export @ file://../../packages/bridgecad-export",
  "bridgecad-ai @ file://../../packages/bridgecad-ai",
  "bridgecad-infra @ file://../../packages/bridgecad-infra",
]

[project.scripts]
bridgecad = "bridgecad_cli.main:app"

[tool.setuptools]
packages = ["bridgecad_cli"]

[tool.setuptools.package-dir]
"" = "."
