name: Security scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "bandit[toml]"
      # Advisory, not gating: bandit's B101/B404 noise on a scientific codebase
      # is not worth reddening main. Keep the job visible for triage.
      - run: bandit -r packages apps bridgecad -c pyproject.toml
        continue-on-error: true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      # Advisory, not gating: `--strict` fails on any advisory, including ones
      # with no fixed version available yet. ci.yml owns the blocking audit.
      - run: pip-audit --strict
        continue-on-error: true
