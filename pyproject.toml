[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# ─────────────────────────────────────────────────────────────────────────────
# Project metadata
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "bridgecad-enterprise-suite"
version = "0.1.0rc1"                     # PEP 440 form of 0.1.0-rc1
description = "Parametric bridge GAD generation — Excel workbook in, 7-sheet IRC-compliant DXF package, priced BOQ and QA report out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
  "bridge", "cad", "dxf", "gad", "civil-engineering",
  "irc", "morth", "boq", "ezdxf", "parametric-design",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Construction",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Civil Engineering",
  "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]

# No email: keeps the public tree free of PII (see CONTRIBUTING.md §6).
# If you add one, the CI PII scanner needs its egg-info exclusion — already present.
authors = [{ name = "CRAJKUMARSINGH" }]
maintainers = [{ name = "CRAJKUMARSINGH" }]

# ── URLs: point at the canonical CRAJKUMARSINGH repo ────────────────────────
[project.urls]
Homepage = "https://github.com/CRAJKUMARSINGH/BridgeCAD-Enterprise-Suite"
Repository = "https://github.com/CRAJKUMARSINGH/BridgeCAD-Enterprise-Suite"
Issues = "https://github.com/CRAJKUMARSINGH/BridgeCAD-Enterprise-Suite/issues"
Changelog = "https://github.com/CRAJKUMARSINGH/BridgeCAD-Enterprise-Suite/blob/main/CHANGELOG.md"
Documentation = "https://CRAJKUMARSINGH.github.io/BridgeCAD-Enterprise-Suite/"
"Bug Tracker" = "https://github.com/CRAJKUMARSINGH/BridgeCAD-Enterprise-Suite/issues/new?labels=bug"

# ── Console entry point: zero-install CLI shim ─────────────────────────────
[project.scripts]
bridgecad = "bridgecad.__main__:app"

# ─────────────────────────────────────────────────────────────────────────────
# Optional dependency groups — everything heavy is opt-in
# ─────────────────────────────────────────────────────────────────────────────
[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "pydantic>=2.9,<3",
]
ui = [
  "streamlit>=1.38",
]
ai = [
  "scipy>=1.13",
  "numpy>=1.26",
]
infra = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "redis>=5.0",
  "boto3>=1.34",
  "structlog>=24.1",
  "arq>=0.26",
]
docs = [
  "mkdocs-material>=9.5,<10",
  "mkdocs-minify-plugin>=0.8",
  "mkdocstrings[python]>=0.25",
  "mkdocs-git-revision-date-localized-plugin>=1.2",
]
dev = [
  # test
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "pytest-xdist>=3.6",
  "hypothesis>=6.100",
  "pyyaml>=6.0",
  # quality
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit[toml]>=1.7",
  "pip-audit>=2.7",
  # tooling
  "pre-commit>=3.7",
  "commitizen>=3.27",
  "build>=1.2",
  "types-requests",
]
draw = [
  "matplotlib>=3.8",
  "pillow>=10.0",
  "cairosvg>=2.7",
]
refs = [
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "pyyaml>=6.0",
]
refs-ocr = [
  "pytesseract>=0.3.10",
  "pypdfium2>=4.30",
  "pillow>=10.0.0",
  "numpy>=1.26",
]
all = [
  "bridgecad-enterprise-suite[api,ui,ai,infra,docs,draw,refs,refs-ocr]",
]

# ─────────────────────────────────────────────────────────────────────────────
# Workspace
# ─────────────────────────────────────────────────────────────────────────────
[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
bridgecad-core = { workspace = true }
bridgecad-io = { workspace = true }
bridgecad-draw = { workspace = true }
bridgecad-bill = { workspace = true }
bridgecad-qa = { workspace = true }
bridgecad-export = { workspace = true }
bridgecad-plugins = { workspace = true }
bridgecad-ai = { workspace = true }
bridgecad-infra = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["bridgecad"]

# ─────────────────────────────────────────────────────────────────────────────
# ruff — lint + format
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".venv", "build", "dist", "site", "site-api",
  "03_outputs", "outputs", "test_run_sample",
  "docs/api/_build",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "PTH",  # flake8-use-pathlib
  "T20",  # flake8-print
  "ARG",  # unused arguments
]
ignore = [
  "E501",   # line length handled by the formatter
  "B008",   # function call in default arg (FastAPI Depends)
  "SIM108", # ternaries are not always clearer
  "RUF001", # ambiguous unicode in strings — we use real minus signs in drawings
  "RUF002", # ambiguous unicode in docstrings — same reason as RUF001
  "RUF003", # ambiguous unicode in comments — same reason as RUF001
  # ── Engineering notation ──────────────────────────────────────────────────
  # Quantities, the standards tables and the section-property helpers use the
  # symbols the codes use: L, W, D, H as locals and as parameters, DField/IField
  # as field constructors, and class-scope names that keep their unit suffix
  # (fy_MPa, fpk_MPa, horizontal_curve_R_m). Lower-casing them would break the
  # one-to-one mapping between the code, the clause it implements and the text
  # printed on the drawing — a bigger cost than the naming rule saves.
  "N806",   # non-lowercase variable in function
  "N803",   # non-lowercase argument name
  "N802",   # non-lowercase function name
  "N815",   # mixed-case variable in class scope
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "ARG", "B011"]
"**/tests/**" = ["T20", "ARG", "B011", "E402"]
"scripts/**" = ["T20"]
"docs/**" = ["T20"]
"**/__init__.py" = ["F401"]   # re-exports
"conftest.py" = ["ARG"]
# Hand-run verification/audit scripts sit at the *package* root rather than
# inside an importable package (dayN_verify.py, weekN_final_signoff.py,
# _audit_*.py, smoke_test_*.py, check_*.py). They print a status report for a
# human and are written as dense one-liners, so the output, one-liner layout and
# path-style rules do not apply — the same precedent as scripts/ above. Bugbear
# and pyflakes stay on: those catch real mistakes, not style.
"packages/*/*.py" = ["T20", "E701", "E702", "E402", "ARG001", "PTH118", "PTH123", "UP031", "B007"]
# The IS 875 wind-speed enum keeps its unit suffix in the class name
# (``WindSpeedBasic_ms``) because the code reads the zone table one-to-one;
# renaming it would desync 20+ call sites from the clause it implements.
"packages/bridgecad-core/bridgecad_core/types.py" = ["N801"]
# Operator/robot scripts mutate sys.path (or call into a product package) before
# importing it, so a module-level import below the setup is deliberate — not a
# misplaced import.
"scripts/browser_test.py" = ["T20", "E402"]
"scripts/create_repo_sample_catalogue.py" = ["T20", "E402"]
"scripts/generate_templates.py" = ["T20", "E402"]
"scripts/robotic_test_viaduct.py" = ["T20", "E402"]
"scripts/test_netlify_readiness.py" = ["T20", "E402"]
"scripts/wing_report.py" = ["T20", "E402"]

[tool.ruff.lint.isort]
known-first-party = [
  "bridgecad_core", "bridgecad_io", "bridgecad_draw", "bridgecad_bill",
  "bridgecad_qa", "bridgecad_export", "bridgecad_plugins", "bridgecad_ai",
  "bridgecad_infra",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ─────────────────────────────────────────────────────────────────────────────
# mypy — strict on core, pragmatic elsewhere
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
pretty = true
exclude = [
  "^(build|dist|site|site-api|\\.venv)/",
  "^03_outputs/", "^outputs/", "^test_run_sample/",
]

[[tool.mypy.overrides]]
module = ["scipy.*", "ezdxf.*", "reportlab.*", "cairosvg.*", "arq.*", "boto3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ─────────────────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Flattened monorepo — resolve all packages directly from the repo root so the
# suite runs without an editable install.
pythonpath = [
  ".",
  "packages/bridgecad-core",
  "packages/bridgecad-io",
  "packages/bridgecad-draw",
  "packages/bridgecad-bill",
  "packages/bridgecad-qa",
  "packages/bridgecad-export",
  "packages/bridgecad-plugins",
  "packages/bridgecad-ai",
  "packages/bridgecad-infra",
  "packages/bridgecad-refs",
  "apps/api-gateway",
  "apps/cli-console",
]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
]
markers = [
  "slow: takes more than a second",
  "e2e: end-to-end fixture run",
  "integration: crosses package boundaries",
  "benchmark: performance gate",
  "bench: benchmark tests",
  "requires_docker: needs a service container",
  "docs: documentation verification suite",
  "draw: drawing geometry and DXF contract tests",
  "visual: PNG baseline comparison",
  "refs: reference-drawing corpus and extraction tests",
]
filterwarnings = [
  "error::DeprecationWarning:bridgecad_.*",
  "ignore::DeprecationWarning:ezdxf.*",
]
xfail_strict = true

# ─────────────────────────────────────────────────────────────────────────────
# coverage
# ─────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["packages", "apps"]
omit = [
  "*/tests/*", "*/test_*.py",
  "*/__init__.py",
  "*/_build/*",
  "docs/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "@overload",
  "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ─────────────────────────────────────────────────────────────────────────────
# benchmarks
# ─────────────────────────────────────────────────────────────────────────────
# pytest-benchmark reads its own table, not a nested key under
# [tool.pytest.ini_options] — a nested table there is an unknown ini option and
# `--strict-config` fails the whole run.
# Gate: fail if a benchmark regresses more than 20% against the stored baseline.
# Thresholds enforced: QA < 200ms, BOQ < 500ms, 1 sheet < 3s, 7 sheets < 15s.
[tool.pytest-benchmark]
autosave = false
storage = ".benchmarks"
compare = "0001"
min_rounds = 5
warmup = false
sort = "mean"
timer = "perf_counter"
disable_gc = false

# ─────────────────────────────────────────────────────────────────────────────
# bandit
# ─────────────────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist", "site"]
skips = ["B101"]   # assert is fine in library code

# ─────────────────────────────────────────────────────────────────────────────
# commitizen — Conventional Commits
# ─────────────────────────────────────────────────────────────────────────────
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0rc1"
tag_format = "v$version"
version_scheme = "pep440"
version_files = [
  "pyproject.toml",
  "packages/bridgecad-core/pyproject.toml",
  "packages/bridgecad-io/pyproject.toml",
  "packages/bridgecad-draw/pyproject.toml",
  "packages/bridgecad-bill/pyproject.toml",
  "packages/bridgecad-qa/pyproject.toml",
  "packages/bridgecad-export/pyproject.toml",
  "packages/bridgecad-plugins/pyproject.toml",
  "packages/bridgecad-ai/pyproject.toml",
  "packages/bridgecad-infra/pyproject.toml",
  "bridgecad/__init__.py",
]
update_changelog_on_bump = true
