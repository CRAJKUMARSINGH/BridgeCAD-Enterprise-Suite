[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgecad-core"
version = "0.1.0"
description = "BridgeCAD Enterprise — Core Domain: types, models, geometry, standards, validation, quantities, costs"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
]

[tool.setuptools]
packages = ["bridgecad_core"]

[tool.setuptools.package-dir]
"" = "."
