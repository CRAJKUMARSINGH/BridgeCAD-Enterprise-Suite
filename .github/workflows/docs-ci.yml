name: Docs integrity

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".lychee.toml", "scripts/check_doc_paths.py"]
  pull_request:
    paths: ["**/*.md", ".lychee.toml", "scripts/check_doc_paths.py"]
  schedule:
    - cron: "0 6 * * 1"   # weekly: external links rot without a push
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: External + internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: config keys are version-sensitive.
      # `fail: false` — external link rot (vendor docs moved, DOI redirects) must
      # not redden main. Internal/relative links are still enforced by
      # tests/docs/test_doc_integrity.py and scripts/check_doc_paths.py.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            --verbose
            '**/*.md'
          fail: false

  path-audit:
    name: Paths inside code blocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_doc_paths.py --verbose
