[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgecad-streamlit-ui"
version = "0.1.0rc1"
description = "BridgeCAD Enterprise — Streamlit Ultimate UI (15 tabs)"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.32.0",
  "bridgecad-core",
  "bridgecad-io",
  "bridgecad-draw",
  "bridgecad-bill",
  "bridgecad-qa",
  "bridgecad-export",
  "bridgecad-ai",
  "bridgecad-infra",
  "ezdxf>=1.4.0",
  "matplotlib>=3.7.0",
  "plotly>=5.17.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
]

[tool.setuptools]
# The Streamlit UI is a single-file application (app.py), not a library package:
# there is no bridgecad_streamlit/ directory. The old
# packages = ["bridgecad_streamlit"] made `pip install apps/streamlit-ui`
# fail with "package directory does not exist". Ship the module instead.
py-modules = ["app"]

[tool.setuptools.package-dir]
"" = "."
