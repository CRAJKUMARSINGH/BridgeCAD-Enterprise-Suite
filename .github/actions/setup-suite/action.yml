name: Setup Suite
description: >
  Install the BridgeCAD workspace under pip in one resolution so member
  dependencies resolve from the checkout. Include the requested root extras.

inputs:
  extras:
    description: Comma-separated root extras, e.g. "dev,draw"
    required: false
    default: "dev"
  python-version:
    required: false
    default: "3.11"
  extra-pip:
    description: Additional packages to install after the workspace
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install workspace
      shell: bash
      env:
        BRIDGECAD_SUITE_EXTRAS: ${{ inputs.extras }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        workspace=()
        for manifest in packages/*/pyproject.toml; do
          workspace+=(-e "${manifest%/pyproject.toml}")
        done
        root=.
        if [ -n "$BRIDGECAD_SUITE_EXTRAS" ]; then
          root=".[$BRIDGECAD_SUITE_EXTRAS]"
        fi
        python -m pip install "${workspace[@]}" -e "$root" --quiet
        if [ -n "${{ inputs.extra-pip }}" ]; then
          python -m pip install ${{ inputs.extra-pip }}
        fi
