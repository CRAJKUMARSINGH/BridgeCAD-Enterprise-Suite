# =============================================================================
# BridgeCAD Enterprise Suite — pre-commit hooks
# Install: pre-commit install
# Run all:  pre-commit run --all-files
# =============================================================================

default_language_version:
  python: python3.11

repos:

  # ── Basic sanity ────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        exclude: \.json$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^apps/web-console/  # tsconfig.json has comments
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch=main, --branch=master]

  # ── Ruff (lint + format) ────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        exclude: ^(apps/web-console|vendor|\.git)/
      - id: ruff-format
        types_or: [python, pyi]
        exclude: ^(apps/web-console|vendor|\.git)/

  # ── Mypy type check (lightweight — just core + io) ─────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        name: mypy (bridgecad_core)
        files: ^packages/bridgecad-core/
        args: [--ignore-missing-imports, --no-error-summary]
        additional_dependencies:
          - pydantic>=2.6.0
          - numpy>=1.26.0

  # ── Security scan ────────────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -ll]  # -ll = medium+ severity only
        types: [python]
        exclude: ^(tests/|scripts/scaffold|apps/web-console)/

  # ── Secrets detection ────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ── Python compile check ─────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-ast
        types: [python]
        exclude: ^apps/web-console/

  # ── TypeScript / Node (web-console only) ────────────────────────────────────
  - repo: local
    hooks:
      - id: ts-typecheck
        name: TypeScript type check (web-console)
        language: node
        entry: bash -c "cd apps/web-console && npm run typecheck"
        types_or: [ts, tsx]
        pass_filenames: false
        stages: [pre-push]   # only on push — too slow for every commit

  # ── Commit message format ────────────────────────────────────────────────────
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ── YAML/JSON formatting ─────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, markdown]
        args: [--prose-wrap=preserve]
        exclude: ^(CHANGELOG\.md|\.github/|tests/)

  - repo: local
    hooks:
      - id: doc-paths
        name: doc code-block paths exist
        entry: python scripts/check_doc_paths.py
        language: system
        files: \.md$

      - id: doc-integrity-fast
        name: doc integrity (fast)
        entry: python scripts/verify_docs.py --only paths,integrity --quiet
        language: system
        pass_filenames: false
        files: \.md$

# ── CI configuration ─────────────────────────────────────────────────────────
ci:
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autofix_prs: true
