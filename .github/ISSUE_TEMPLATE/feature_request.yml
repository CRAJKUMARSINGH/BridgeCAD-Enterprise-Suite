name: Feature request
description: A capability gap in the Suite
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today? Describe the problem, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing" — say what it costs.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - core, io, draw, bill, qa, export, plugins, ai, infra
        - cli, api, streamlit ui, react console, docs
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: This would change the Excel workbook schema (breaking for existing workbooks)
        - label: This would change generated output for existing projects
        - label: This is additive and backward compatible
        - label: This touches a design invariant in GUIDE.md §3
    validations:
      required: true
