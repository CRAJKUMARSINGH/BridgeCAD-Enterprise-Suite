[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgecad-refs"
version = "0.1.0rc1"
description = "BridgeCAD Enterprise — reference drawing corpus: text/OCR extraction, facts and conflicts"
requires-python = ">=3.11"

[project.optional-dependencies]
refs = [
  "pdfplumber>=0.11",
  "pypdf>=5.0",
]
refs-ocr = [
  "pytesseract>=0.3.10",
  "pypdfium2>=4.30",
  "pillow>=10.0.0",
  "numpy>=1.26",
]

[tool.setuptools]
packages = ["bridgecad_refs"]

[tool.setuptools.package-dir]
"" = "."
