name: CI (legacy app)

# Legacy `src/bridge_gad` pipeline, repo-wide hygiene guards, container smoke.
#
# The `wing` / `wing-report` jobs that used to live here ran tests/draw against
# the same tests as draw.yml but with different strictness — that is how the two
# workflows drifted. They now live in draw.yml only.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-suite
        with:
          extras: dev

      # requirements.txt is the LEGACY app's loose pin set; requirements.lock is
      # the pinned Suite set. If these two now conflict, that is the finding.
      - name: Install legacy pins
        run: pip install -r requirements.txt

      # ── Guard: no duplicate requirements ─────────────────────────────────
      - name: Check for duplicate requirements
        run: |
          python - <<'EOF'
          import re, sys
          pkgs = []
          for line in open("requirements.txt"):
              line = line.strip()
              if line and not line.startswith("#"):
                  name = re.split(r"[>=<!;\[\]]", line)[0].lower().replace("-","_")
                  pkgs.append(name)
          dupes = [p for p in set(pkgs) if pkgs.count(p) > 1]
          if dupes:
              print(f"DUPLICATE requirements: {dupes}")
              sys.exit(1)
          print("No duplicate requirements found.")
          EOF

      # ── Guard: no PII in source ───────────────────────────────────────────
      # Scan ONLY git-tracked source files (never build-generated artifacts
      # such as *.egg-info/, which repeat the author email from pyproject).
      - name: Check for PII in tracked source
        run: |
          PII_PATTERNS='@hotmail\|@gmail\|+91[0-9]\{10\}'
          EXCLUDE_DIRS='{*.egg-info/*,*/.egg-info/*,egg-info/*,dist/*,build/*,vendor/*,03_outputs/*,outputs/*,node_modules/*,.venv/*,venv/*,__pycache__/*}'
          if command -v git >/dev/null 2>&1 && git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "[PII] Using git grep over tracked files only"
            EXIT_CODE=0
            git grep -n "$PII_PATTERNS" ':(exclude,glob)**/*.egg-info/**' \
                                    ':(exclude,glob)**/vendor/**'        \
                                    ':(exclude,glob)**/03_outputs/**'   \
                                    ':(exclude,glob)**/outputs/**'       \
                                    ':(exclude,glob)**/dist/**'          \
                                    ':(exclude,glob)**/build/**'         \
                                    || EXIT_CODE=$?
            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "::error::PII detected in tracked source — move to environment variables"
              exit 1
            elif [ "$EXIT_CODE" -eq 1 ]; then
              echo "No PII found in git-tracked source."
            else
              echo "[PII] git grep exit=$EXIT_CODE; falling back to find + grep"
            fi
          fi
          EXIT_CODE=0
          find . -type f \
            \( -name "*.py" -o -name "*.md" -o -name "*.txt" -o -name "*.yaml" -o -name "*.yml" -o -name "*.json" -o -name "*.sh" -o -name "*.ps1" -o -name "*.toml" \) \
            ! -path "./$EXCLUDE_DIRS" \
            -exec grep -l "$PII_PATTERNS" {} + 2>/dev/null || EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::PII detected by fallback scan — see files above"
            exit 1
          fi
          echo "No PII found (fallback scan complete)."

      # ── Guard: telemetry opt-in ───────────────────────────────────────────
      - name: Check telemetry is opt-in
        run: |
          python -c "
          import sys; sys.path.insert(0,'src')
          from bridge_gad.telemetry import TELEMETRY_ENABLED
          assert not TELEMETRY_ENABLED, 'Telemetry must be disabled by default'
          print('Telemetry correctly disabled by default.')
          "

      # ── Guard: library does not hijack logging ────────────────────────────
      - name: Check library does not hijack logging
        run: |
          python -c "
          import logging, sys
          before = len(logging.root.handlers)
          sys.path.insert(0,'src')
          import bridge_gad
          after = len(logging.root.handlers)
          assert after == before, f'bridge_gad import added {after-before} root handler(s)'
          print('Logging not hijacked.')
          "

      # ── Guard: CalcEngine dependency graph ───────────────────────────────
      - name: Smoke test CalcEngine
        run: |
          python -c "
          import sys; sys.path.insert(0,'src')
          from bridge_gad.calc_engine import CalcEngine
          e = CalcEngine.with_bridge_defaults()
          e.set('SPAN1', 12.0); e.set('NSPAN', 3); e.set('LEFT', 0)
          r = e.recalculate()
          assert r.get('LBRIDGE') == 36.0, f'Expected 36.0 got {r.get(\"LBRIDGE\")}'
          print('CalcEngine OK — LBRIDGE =', r['LBRIDGE'])
          "

      # ── Guard: worker module imports cleanly ──────────────────────────────
      - name: Smoke test worker import
        run: |
          python -c "
          import sys; sys.path.insert(0,'src')
          from bridge_gad.worker import WorkerSettings, generate_drawing_job
          print('Worker import OK')
          "

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint
        run: flake8 src/ --max-line-length=120 --ignore=E501,W503,E402 --count

      # ── Type check (advisory; the Suite gate is in suite-ci.yml) ──────────
      - name: Type check (legacy — advisory only)
        run: |
          set +e
          mypy src/bridge_gad/ --ignore-missing-imports --no-error-summary
          MYPY_EXIT=$?
          if [ "$MYPY_EXIT" -ne 0 ]; then
            echo "::notice::Legacy mypy reported issues (exit $MYPY_EXIT) — advisory only, not blocking"
          fi
          exit 0

      # ── Unit tests ────────────────────────────────────────────────────────
      - name: Run tests
        run: pytest test_ultimate_app.py -v --tb=short

      # ── Robotic harness (smoke) ───────────────────────────────────────────
      - name: Robotic pipeline smoke test
        run: python scripts/robotic_test_harness.py

      # ── Netlify deploy readiness ──────────────────────────────────────────
      - name: Netlify deploy readiness check
        run: python scripts/test_netlify_readiness.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for CVEs
        run: |
          set +e
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969
          AUDIT_EXIT=$?
          if [ "$AUDIT_EXIT" -eq 0 ]; then
            echo "pip-audit passed."
          elif [ "$AUDIT_EXIT" -eq 1 ]; then
            echo "::warning::pip-audit reported known vulnerabilities (exit 1) — not blocking release, but please review"
          else
            echo "::warning::pip-audit internal error (exit $AUDIT_EXIT) — advisory only"
          fi
          exit 0

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # ── Docker ────────────────────────────────────────────────────────────
      # The image is built from requirements.lock (pinned Suite set). Its smoke
      # test exercises the Suite facade `bridgecad` — the legacy bridge_gad
      # surface is fenced (ADR-0001) and is no longer the container's contract.
      - name: Build Docker image
        run: docker build -t bridge-gad:ci .
      - name: Smoke test container
        run: |
          docker run --rm bridge-gad:ci python -c "
          import bridgecad as bc
          print('Container import OK', bc.__version__)
          "
