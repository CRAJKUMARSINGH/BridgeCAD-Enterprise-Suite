# ─────────────────────────────────────────────────────────────────────────────
# BridgeCAD Enterprise — Production docker-compose
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Copy .env.example → .env and fill all values
#   2. docker buildx build --platform linux/amd64,linux/arm64 --push  (or pull from registry)
# ─────────────────────────────────────────────────────────────────────────────

name: bridgecad-prod

x-common-env: &common-env
  ENV:             production
  DATABASE_URL:    ${DATABASE_URL}
  BRIDGECAD_API_KEYS: ${BRIDGECAD_API_KEYS}
  LOG_LEVEL:       ${LOG_LEVEL:-INFO}

x-restart: &restart
  restart: unless-stopped

services:

  # ── FastAPI Gateway ────────────────────────────────────────────────────
  api:
    image: bridgecad/api:${BRIDGECAD_VERSION:-0.1.0-rc1}
    <<: *restart
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *common-env
      WORKERS:        ${API_WORKERS:-4}
    depends_on:
      db:    { condition: service_healthy }
      cache: { condition: service_healthy }
    volumes:
      - output_data:/work/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Streamlit UI ───────────────────────────────────────────────────────
  streamlit:
    image: bridgecad/streamlit:${BRIDGECAD_VERSION:-0.1.0-rc1}
    <<: *restart
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      <<: *common-env
      VITE_API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── React Web Console (nginx) ──────────────────────────────────────────
  web:
    image: bridgecad/web:${BRIDGECAD_VERSION:-0.1.0-rc1}
    <<: *restart
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-bridgecad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-bridgecad}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bridgecad}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No port exposed to host in prod — only internal network

  # ── Redis ──────────────────────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    <<: *restart
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --save 60 1000
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── MinIO (S3-compatible) ──────────────────────────────────────────────
  storage:
    image: minio/minio:latest
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Nginx reverse proxy (SSL termination) ─────────────────────────────
  proxy:
    image: nginx:1.27-alpine
    <<: *restart
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
      - streamlit

volumes:
  pgdata:
  redisdata:
  miniodata:
  output_data:

networks:
  default:
    name: bridgecad_prod
