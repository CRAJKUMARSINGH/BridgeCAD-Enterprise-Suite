[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# PROJECT (Route Repo Unified Workspace: facade bridgecad/ + packages/* + apps/*
# all from this repo root directly; no intermediate "BridgeCAD Enterprise Suite"
# folder.)
# =============================================================================
[project]
name            = "bridgecad-route"
version         = "0.1.0-rc1"
description     = "BridgeCAD Enterprise Suite — ROUTE unified workspace: facade + packages + apps"
readme          = "README.md"
requires-python = ">=3.11"
license         = { text = "MIT" }
authors         = [{ name = "BridgeCAD Team", email = "dev@bridgecad.io" }]
keywords        = ["bridge", "GAD", "DXF", "IRC", "MORTH", "CAD", "civil engineering"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "ezdxf>=1.4.0,<2.0",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
    "cairosvg>=2.7.0,<3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.26.0,<3.0",
    "scipy>=1.12.0,<2.0",
    "openpyxl>=3.1.0,<4.0",
    "xlrd>=2.0.0",
    "pandas>=2.0.0,<4.0",
    "pyyaml>=6.0,<7.0",
    "fastapi>=0.112.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "arq>=0.25.0",
    "requests>=2.28.0",
    "typer>=0.12.0,<1.0",
    "rich>=13.8.0,<17.0",
    "click>=8.1.0",
    "shellingham>=1.3.0",
    "streamlit>=1.37.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "pytest-benchmark==4.0.0",
    "pytest-asyncio==0.23.8",
    "ruff==0.6.0",
    "mypy==1.11.0",
    "pre-commit==3.8.0",
    "build==1.2.1",
    "twine==5.1.1",
]

[project.scripts]
bridgecad   = "bridgecad.__main__:app"

[project.urls]
Homepage    = "https://github.com/CRAJKUMARSINGH/Bridge_GAD_Yogendra_Borse"
Repository  = "https://github.com/CRAJKUMARSINGH/Bridge_GAD_Yogendra_Borse"
Issues      = "https://github.com/CRAJKUMARSINGH/Bridge_GAD_Yogendra_Borse/issues"
Changelog   = "CHANGELOG.md"

# =============================================================================
# Workspace layout: all packages live one level below repo root under
# `packages/` and apps under `apps/`.  Facade package `bridgecad/` is at repo
# root itself.
# =============================================================================
[tool.setuptools]
packages = [
    "bridgecad",
    "bridgecad_core",
    "bridgecad_core.geometry",
    "bridgecad_core.standards",
    "bridgecad_io",
    "bridgecad_draw",
    "bridgecad_draw.engines",
    "bridgecad_draw.sheets",
    "bridgecad_bill",
    "bridgecad_bill.formatters",
    "bridgecad_qa",
    "bridgecad_export",
    "bridgecad_plugins",
    "bridgecad_ai",
    "bridgecad_infra",
    "bridgecad_api",
    "bridgecad_cli",
]

[tool.setuptools.package-dir]
"bridgecad"        = "bridgecad"
"bridgecad_core"   = "packages/bridgecad-core/bridgecad_core"
"bridgecad_io"     = "packages/bridgecad-io/bridgecad_io"
"bridgecad_draw"   = "packages/bridgecad-draw/bridgecad_draw"
"bridgecad_bill"   = "packages/bridgecad-bill/bridgecad_bill"
"bridgecad_qa"     = "packages/bridgecad-qa/bridgecad_qa"
"bridgecad_export" = "packages/bridgecad-export/bridgecad_export"
"bridgecad_plugins"= "packages/bridgecad-plugins/bridgecad_plugins"
"bridgecad_ai"     = "packages/bridgecad-ai/bridgecad_ai"
"bridgecad_infra"  = "packages/bridgecad-infra/bridgecad_infra"
"bridgecad_api"    = "apps/api-gateway/bridgecad_api"
"bridgecad_cli"    = "apps/cli-console/bridgecad_cli"

[tool.setuptools.package-data]
"bridgecad_plugins" = ["plugins/*/*.yaml", "plugins/*/*.yml", "plugins/*/*.json"]
"bridgecad_bill"    = ["formatters/*"]

# =============================================================================
# Ruff
# =============================================================================
[tool.ruff]
line-length    = 110
target-version = "py311"
src            = [".", "packages", "apps", "scripts", "tests"]
exclude        = [
    ".git", "__pycache__", ".mypy_cache", ".ruff_cache",
    "node_modules", "dist", "build", ".venv", "vendor",
    "apps/web-console", "nginx", "migrations", "standards",
]

[tool.ruff.lint]
select  = ["E", "F", "I", "UP", "B", "SIM", "C4", "TID"]
ignore  = [
    "E501",
    "B008",
    "UP007",
    "E402",
]
unfixable = ["F841"]

[tool.ruff.lint.isort]
known-first-party = [
    "bridgecad",
    "bridgecad_core", "bridgecad_io", "bridgecad_draw",
    "bridgecad_bill", "bridgecad_qa", "bridgecad_export",
    "bridgecad_plugins", "bridgecad_ai", "bridgecad_infra",
    "bridgecad_cli", "bridgecad_api",
]
section-order = ["future","standard-library","third-party","first-party","local-folder"]

[tool.ruff.format]
quote-style   = "double"
indent-style  = "space"
line-ending   = "auto"

# =============================================================================
# Mypy
# =============================================================================
[tool.mypy]
python_version         = "3.11"
warn_return_any        = true
ignore_missing_imports = true
explicit_package_bases = true
exclude                = ["tests/", "scripts/", "apps/web-console/"]

[[tool.mypy.overrides]]
module             = ["ezdxf.*", "scipy.*", "openpyxl.*", "reportlab.*", "yaml"]
ignore_missing_imports = true

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths    = ["tests", "packages"]
pythonpath   = [
    ".",
    "packages/bridgecad-core",
    "packages/bridgecad-io",
    "packages/bridgecad-draw",
    "packages/bridgecad-bill",
    "packages/bridgecad-qa",
    "packages/bridgecad-export",
    "packages/bridgecad-plugins",
    "packages/bridgecad-ai",
    "packages/bridgecad-infra",
    "apps/cli-console",
    "apps/api-gateway",
]
addopts      = "-ra --strict-markers --tb=short -q"
markers      = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "e2e:  end-to-end fixture tests",
    "bench: benchmark tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic",
    "ignore::DeprecationWarning:ezdxf",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source   = ["bridgecad", "packages", "apps"]
omit     = ["*/tests/*", "*/migrations/*", "*/__pycache__/*"]
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_empty   = true
fail_under   = 60

# =============================================================================
# Benchmark
# =============================================================================
[tool.pytest-benchmark]
min_rounds     = 5
max_time       = 10.0
sort           = "mean"
timer          = "perf_counter"
disable_gc     = false
warmup         = false
