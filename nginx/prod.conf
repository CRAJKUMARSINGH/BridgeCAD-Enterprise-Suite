# BridgeCAD Enterprise — nginx reverse proxy (production)
# Place TLS certs at nginx/certs/bridgecad.crt + bridgecad.key

upstream api_backend {
    server api:8000;
    keepalive 32;
}

upstream streamlit_backend {
    server streamlit:8501;
}

upstream web_backend {
    server web:80;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/bridgecad.crt;
    ssl_certificate_key /etc/nginx/certs/bridgecad.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;   # allow large Excel uploads
    proxy_read_timeout   300s;  # DXF generation can take 30–60 s

    # ── React SPA ──────────────────────────────────────────────────────
    location / {
        proxy_pass http://web_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── FastAPI (all /api/* and direct health/version) ──────────────────
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /health  { proxy_pass http://api_backend/health; }
    location /version { proxy_pass http://api_backend/version; }
    location /docs    { proxy_pass http://api_backend/docs; }
    location /openapi.json { proxy_pass http://api_backend/openapi.json; }

    # ── Streamlit ───────────────────────────────────────────────────────
    location /streamlit/ {
        rewrite ^/streamlit/(.*) /$1 break;
        proxy_pass http://streamlit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;
    }
}
