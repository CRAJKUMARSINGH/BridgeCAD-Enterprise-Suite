[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgecad-cli-console"
version = "0.1.0rc1"
description = "BridgeCAD Enterprise — Typer CLI console"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.8.0,<17.0",
  "click>=8.1.0",
  "shellingham>=1.3.0",
  "bridgecad-core",
  "bridgecad-io",
  "bridgecad-draw",
  "bridgecad-plugins",
  "bridgecad-bill",
  "bridgecad-qa",
  "bridgecad-export",
  "bridgecad-ai",
  "bridgecad-infra",
]

[project.scripts]
bridgecad = "bridgecad_cli.main:app"

[tool.setuptools]
packages = ["bridgecad_cli"]

[tool.setuptools.package-dir]
"" = "."
